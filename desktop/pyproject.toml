[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcut"
version = "0.1.0"
description = "Local Gemma-powered video editor: prompt-driven cuts via Ollama + ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TaylorAmarelTech" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
ui = ["gradio>=4.36"]
pose = ["mediapipe>=0.10.14; python_version<'3.13'"]
all = ["gradio>=4.36", "mediapipe>=0.10.14; python_version<'3.13'"]

[project.scripts]
vidcut = "vidcut.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vidcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
